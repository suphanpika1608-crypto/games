            options: ["ระบบย่อยอาหาร", "ระบบการขนส่งออกซิเจนในเลือด (Methemoglobinemia)", "ระบบประสาทส่วนกลาง", "ระบบขับถ่ายปัสสาวะ"],
            answer: 1,
            explanation: "ไนไตรต์ไปเปลี่ยนฮีโมโกลบินเป็นเมทฮีโมโกลบิน ทำให้ปลาขาดออกซิเจนแม้ในน้ำจะมี DO สูง"
        },
        {
            category: "คุณภาพน้ำในการเพาะเลี้ยง",
            q: "ในช่วงเวลาใกล้รุ่งสาง (ตี 4 - 6 โมงเช้า) ค่าคุณภาพน้ำตัวใดในบ่อเลี้ยงปลาหนาแน่นมีความเสี่ยงวิกฤตต่ำสุดจนทำให้ปลาลอยหัว?",
            options: ["ค่า pH", "ค่า Dissolved Oxygen (DO)", "ค่า Total Ammonia Nitrogen (TAN)", "ค่าความเค็ม (Salinity)"],
            answer: 1,
            explanation: "ตอนเช้ามืดพืชและสัตว์น้ำหายใจแย่งออกซิเจน ทำให้ค่า DO ลดต่ำลงถึงจุดวิกฤต"
        },
        {
            category: "คุณภาพน้ำในการเพาะเลี้ยง",
            q: "แอมโมเนียในน้ำที่มีความเป็นพิษสูงต่อปลามากที่สุด (Un-ionized ammonia - $\text{NH}_3$) จะมีปริมาณเพิ่มสูงขึ้นเมื่อค่าใดในน้ำสูงขึ้น?",
            options: ["ค่า pH สูงขึ้น และอุณหภูมิสูงขึ้น", "ค่า pH ต่ำลง และอุณหภูมิต่ำลง", "ความเค็มลดลงอย่างมาก", "ความขุ่นของน้ำสูงขึ้น"],
            answer: 0,
            explanation: "แอมโมเนียอิสระที่เป็นพิษจะเพิ่มขึ้นตามค่า pH และอุณหภูมิที่สูงขึ้นในบ่อ"
        }
    ];

    let activePool = [];
    let currentQuestion = null;
    let score = 0;
    let streak = 0;
    let questionCounter = 1;

    // ฟังก์ชันสลับตำแหน่งอาเรย์แบบสุ่ม
    function shuffle(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initGame() {
        score = 0;
        streak = 0;
        questionCounter = 1;
        refillPool();
        loadNextQuestion();
    }

    // เติมคลังข้อสอบและสับใหม่ทั้งหมด เพื่อให้แน่ใจว่าจะไม่เจอข้อซ้ำจนกว่าจะครบทุกข้อ
    function refillPool() {
        activePool = shuffle(masterQuestionBank);
    }

    function loadNextQuestion() {
        if (activePool.length === 0) {
            refillPool(); // ถอนครบทุกข้อในคลังแล้ว สับชุดใหม่เริ่มวนรอบใหม่
        }

        currentQuestion = activePool.pop(); // ดึงข้อสอบออกทีละข้อจากคลัง

        document.getElementById("badge-category").innerText = currentQuestion.category;
        document.getElementById("question-text").innerText = currentQuestion.q;
        document.getElementById("q-count").innerText = "ข้อที่: " + questionCounter;
        document.getElementById("score-text").innerText = "คะแนน: " + score;
        document.getElementById("streak-text").innerText = "คอมโบ 🔥: " + streak;
        document.getElementById("pool-status-text").innerText = "ข้อสอบเหลือในคลังรอบนี้: " + activePool.length + " ข้อ (จากทั้งหมด " + masterQuestionBank.length + " ข้อ)";

        // สลับตำแหน่งตัวเลือกในข้อนั้นๆ
        let optionsWithIndex = currentQuestion.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
        optionsWithIndex = shuffle(optionsWithIndex);

        const optContainer = document.getElementById("options-container");
        optContainer.innerHTML = "";

        optionsWithIndex.forEach((item, displayIdx) => {
            const btn = document.createElement("button");
            btn.className = "btn";
            btn.innerText = (displayIdx + 1) + ". " + item.text;
            btn.onclick = () => checkAnswer(item.originalIndex, currentQuestion.answer, currentQuestion.explanation);
            optContainer.appendChild(btn);
        });

        document.getElementById("feedback").style.display = "none";
        document.getElementById("next-btn").style.display = "none";
    }

    function checkAnswer(selected, correct, explanation) {
        const buttons = document.querySelectorAll("#options-container .btn");
        buttons.forEach(b => b.disabled = true); // ปิดปุ่มกันกดซ้ำ

        const feedback = document.getElementById("feedback");
        feedback.style.display = "block";

        if (selected === correct) {
            score += 10 + (streak * 2);
            streak += 1;
            feedback.className = "correct";
            feedback.innerHTML = "🎉 ถูกต้องครับ! " + explanation;
        } else {
            streak = 0;
            feedback.className = "incorrect";
            feedback.innerHTML = "❌ ผิดครับ! " + explanation;
        }

        document.getElementById("score-text").innerText = "คะแนน: " + score;
        document.getElementById("streak-text").innerText = "คอมโบ 🔥: " + streak;
        document.getElementById("next-btn").style.display = "block";
    }

    function nextQuestion() {
        questionCounter++;
        loadNextQuestion();
    }

    // เริ่มเกมครั้งแรก
    initGame();
</script>
